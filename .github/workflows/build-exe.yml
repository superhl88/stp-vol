name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install cadquery-ocp openpyxl pyinstaller

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --console `
            --name "batch_stp_volume" `
            --collect-all OCP `
            --hidden-import openpyxl `
            --hidden-import openpyxl.styles `
            --hidden-import openpyxl.utils `
            batch_stp_volume.py

      - name: Package output folder into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path ".\dist\batch_stp_volume\*" -DestinationPath ".\batch_stp_volume_win64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-stp-volume-windows
          path: batch_stp_volume_win64.zip
          retention-days: 30
